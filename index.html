<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Bar Golens</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <section class="card">

            <header class="cabecalho">

                <h1>BAR GOLENS</h1>

                <p>
                    Calculadora de serviços
                </p>

            </header>


            <!-- SERVIÇOS MEC -->

            <section class="secao">

                <h2>Serviços Mec</h2>

                <div class="lista-servicos">

                    <div class="servico">

                        <div>
                            <strong>Pneu</strong>
                            <span>R$ 1.100</span>
                        </div>

                        <input
                            type="number"
                            id="pneu"
                            min="0"
                            value="0"
                        >

                    </div>


                    <div class="servico">

                        <div>
                            <strong>Chave</strong>
                            <span>R$ 2.300</span>
                        </div>

                        <input
                            type="number"
                            id="chave"
                            min="0"
                            value="0"
                        >

                    </div>


                    <div class="servico">

                        <div>
                            <strong>Reparo</strong>
                            <span>R$ 1.100</span>
                        </div>

                        <input
                            type="number"
                            id="reparo"
                            min="0"
                            value="0"
                        >

                    </div>


                    <div class="servico">

                        <div>
                            <strong>Kit Básico</strong>
                            <span>R$ 1.100</span>
                        </div>

                        <input
                            type="number"
                            id="kitBasico"
                            min="0"
                            value="0"
                        >

                    </div>


                    <div class="servico">

                        <div>
                            <strong>Kit Avançado</strong>
                            <span>R$ 3.400</span>
                        </div>

                        <input
                            type="number"
                            id="kitAvancado"
                            min="0"
                            value="0"
                        >

                    </div>

                </div>

            </section>


            <!-- TUNING -->

            <section class="secao">

                <label class="checkbox">

                    <input
                        type="checkbox"
                        id="usarTuning"
                    >

                    <span>
                        Adicionar Tuning
                    </span>

                </label>


                <div
                    id="campoTuning"
                    class="campo-escondido"
                >

                    <label for="tuning">
                        Valor original do tuning
                    </label>

                    <input
                        type="number"
                        id="tuning"
                        min="0"
                        value="0"
                    >


                    <div class="linha-tuning">

                        <span>
                            Valor com +50%
                        </span>

                        <strong id="tuningFinal">
                            R$ 0,00
                        </strong>

                    </div>

                </div>

            </section>


            <!-- RESTAURANTE -->

            <section class="secao">

                <h2>Serviços Restaurante</h2>

                <div class="lista-servicos">

                    <div class="servico">

                        <div>
                            <strong>Ursinhos</strong>
                            <span>R$ 5.000</span>
                        </div>

                        <input
                            type="number"
                            id="ursinhos"
                            min="0"
                            value="0"
                        >

                    </div>


                    <div class="servico">

                        <div>
                            <strong>Combos</strong>
                            <span>R$ 2.500</span>
                        </div>

                        <input
                            type="number"
                            id="combos"
                            min="0"
                            value="0"
                        >

                    </div>


                    <div class="servico">

                        <div>
                            <strong>Alcoólicos</strong>
                            <span>R$ 0</span>
                        </div>

                        <input
                            type="number"
                            id="alcoolicos"
                            min="0"
                            value="0"
                        >

                    </div>

                </div>

            </section>


            <!-- BOTÕES -->

            <div class="botoes">

                <button
                    type="button"
                    id="calcular"
                >
                    CALCULAR
                </button>

                <button
                    type="button"
                    id="limpar"
                >
                    LIMPAR
                </button>

            </div>


            <!-- RESULTADO -->

            <section class="resultado">

                <h2>Resumo</h2>

                <div id="resumo">

                    <p class="vazio">
                        Nenhum serviço selecionado.
                    </p>

                </div>


                <div class="total">

                    <span>TOTAL</span>

                    <strong id="valorTotal">
                        R$ 0,00
                    </strong>

                </div>

            </section>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
